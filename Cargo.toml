[package]
name = "taro-lang"
version = "0.1.0"
edition = "2024"
description = "A dynamically-typed scripting language"
repository = "https://github.com/MoleSir/taro"
license-file = "LICENSE"
keywords = [ "vm", "interpreter", "language" ]

[[bin]]
name = "taro"
path = "bin/taro.rs"

[dependencies]
num_enum = "0.7.6"
paste = "1.0.15"
thiserror = "2.0.18"
anyhow = "1.0"
libloading = "0.8"
libffi = "4"
rand = "0.10.1"
rustyline = "15"
serde_json = "1"

[features]
default = [] 
debug-gc = []
gc-stress = []
